{% extends "base.html" %}

{% block title %}Acceso Cliente - SST Gestor{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-shadow p-5 text-center">
                <i class="bi bi-person-badge" style="font-size: 4rem; color: var(--primary);"></i>
                <h2 class="mt-3">Portal del Cliente</h2>
                <p class="text-muted">Ingresa tu código de acceso para ver el estado de tu proyecto.</p>
                <form id="formAccesoCliente" class="mt-4">
                    <div class="input-group">
                        <input type="text" id="codigoAccesoCliente" class="form-control form-control-lg" placeholder="Ej: 59A992CB" required>
                        <button class="btn btn-primary btn-lg" type="submit">Acceder</button>
                    </div>
                    <small class="text-muted">Si no tienes un código, contacta a tu consultor.</small>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('formAccesoCliente').addEventListener('submit', function(e) {
        e.preventDefault();
        const codigo = document.getElementById('codigoAccesoCliente').value.trim();
        if (codigo) {
            window.location.href = `/cliente/${codigo}`;
        } else {
            alert('Por favor, ingresa tu código de acceso.');
        }
    });
</script>
{% endblock %}
