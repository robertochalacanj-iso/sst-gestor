{% extends "base.html" %}

{% block title %}Gestión de Propuestas - SST Gestor{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-file-earmark-text"></i> Gestión de Propuestas</h2>
        <a href="/" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nueva Propuesta</a>
    </div>

    <!-- Filtros -->
    <div class="card card-shadow p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-bold">Filtrar por Cliente</label>
                <select class="form-select" id="filtroCliente" onchange="cargarPropuestas()">
                    <option value="">Todos los clientes</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Filtrar por Estado</label>
                <select class="form-select" id="filtroEstado" onchange="cargarPropuestas()">
                    <option value="">Todos</option>
                    <option value="Borrador">Borrador</option>
                    <option value="Enviada">Enviada</option>
                    <option value="Aceptada">Aceptada</option>
                    <option value="Rechazada">Rechazada</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Buscar por RUC</label>
                <input type="text" class="form-control" id="filtroRuc" placeholder="Ingresa RUC..." onkeyup="cargarPropuestas()">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-secondary w-100" onclick="limpiarFiltros()"><i class="bi bi-eraser"></i> Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Tabla de propuestas -->
    <div class="card card-shadow p-4">
        <div class="table-responsive">
            <table class="table table-striped table-hover" id="tablaPropuestas">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>RUC</th>
                        <th>Total Mensual</th>
                        <th>Total Anual</th>
                        <th>Estado</th>
                        <th>Última actualización</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyPropuestas">
                    <tr><td colspan="8" class="text-center text-muted">Cargando propuestas...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let todasPropuestas = [];

    function cargarClientesFiltro() {
        fetch('/api/clientes')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('filtroCliente');
                data.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.razon_social;
                    select.appendChild(opt);
                });
            });
    }

    function cargarPropuestas() {
        const clienteId = document.getElementById('filtroCliente').value;
        const estado = document.getElementById('filtroEstado').value;
        const ruc = document.getElementById('filtroRuc').value.trim().toLowerCase();

        fetch('/api/propuestas')
            .then(res => res.json())
            .then(data => {
                todasPropuestas = data;
                let filtradas = data;
                if (clienteId) {
                    filtradas = filtradas.filter(p => p.cliente_id == clienteId);
                }
                if (estado) {
                    filtradas = filtradas.filter(p => p.estado === estado);
                }
                if (ruc) {
                    filtradas = filtradas.filter(p => p.ruc.toLowerCase().includes(ruc));
                }
                renderTabla(filtradas);
            })
            .catch(err => console.error('Error:', err));
    }

    function renderTabla(data) {
        const tbody = document.getElementById('tbodyPropuestas');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No hay propuestas que coincidan con los filtros</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(p => {
            let fechaDisplay = new Date(p.fecha_creacion).toLocaleDateString('es-EC');
            if (p.fecha_actualizacion && p.fecha_actualizacion !== p.fecha_creacion) {
                fechaDisplay = `🔄 Editada: ${new Date(p.fecha_actualizacion).toLocaleDateString('es-EC')}`;
            }
            const estadoBadge = {
                'Borrador': 'secondary',
                'Enviada': 'primary',
                'Aceptada': 'success',
                'Rechazada': 'danger'
            }[p.estado] || 'secondary';

            return `
                <tr>
                    <td>#${p.id}</td>
                    <td>${p.cliente}</td>
                    <td>${p.ruc}</td>
                    <td><strong>$${p.total_mensual.toFixed(2)}</strong></td>
                    <td>$${p.total_anual.toFixed(2)}</td>
                    <td><span class="badge bg-${estadoBadge}">${p.estado}</span></td>
                    <td>${fechaDisplay}</td>
                    <td>
                        <a href="/editar-propuesta/${p.id}" class="btn btn-sm btn-warning" title="Editar propuesta">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="/api/propuestas/${p.id}/pdf" class="btn btn-sm btn-success" target="_blank" title="Descargar PDF">
                            <i class="bi bi-file-pdf"></i>
                        </a>
                        <button class="btn btn-sm btn-danger" onclick="eliminarPropuesta(${p.id})" title="Eliminar propuesta">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function eliminarPropuesta(propuestaId) {
        if (!confirm(`¿Estás seguro de eliminar la propuesta #${propuestaId}?`)) return;
        fetch(`/api/propuestas/${propuestaId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    showToast(data.error, 'Error', 'danger');
                } else {
                    showToast(`Propuesta #${propuestaId} eliminada`, 'Éxito', 'success');
                    cargarPropuestas();
                }
            })
            .catch(err => showToast('Error al eliminar propuesta', 'Error', 'danger'));
    }

    function limpiarFiltros() {
        document.getElementById('filtroCliente').value = '';
        document.getElementById('filtroEstado').value = '';
        document.getElementById('filtroRuc').value = '';
        cargarPropuestas();
    }

    document.addEventListener('DOMContentLoaded', function() {
        cargarClientesFiltro();
        cargarPropuestas();
    });
</script>
{% endblock %}
